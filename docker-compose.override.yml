# Local development overrides
# This file is automatically merged with docker-compose.yml when running `docker compose up`

version: '3.9'

services:
  postgres:
    ports:
      - "5432:5432"

  backend:
    volumes:
      - ./backend:/app
    environment:
      DART_ENV: development

  frontend:
    volumes:
      - ./frontend:/app
    environment:
      FLUTTER_ENV: development
